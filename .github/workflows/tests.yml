name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Dependencies resolve to caret ranges, so an upstream release can break
    # this repo with no push to it. A weekly run surfaces that drift instead
    # of leaving it to be found by whoever pushes next.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight run redundant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, rather than stopping at the first.
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    name: Lint, PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        # Proves the package installs on every PHP version it supports.
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: |
          find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  test:
    runs-on: ubuntu-latest

    # Pest 5 needs PHP 8.4, so the suite in qa/ runs on 8.4 only.
    name: Test, PHP 8.4

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # PestWP provisions SQLite rather than MySQL, so no service container.
          extensions: sqlite3, pdo_sqlite, mbstring, dom, curl, zip
          coverage: none

      - name: Install dependencies
        run: composer update --working-dir=qa --no-interaction --no-progress --prefer-dist

      - name: Test
        run: composer test
